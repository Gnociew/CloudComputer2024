ue of community and compassion.", "entity_type": "\"PERSON\"", "id": "\"SCROOGE\"", "label": "\"SCROOGE\"", "shape": "dot", "size": 10, "source_id": "chunk-90b95db5c53e4364a6bee36b7aa4d70f\u003cSEP\u003echunk-43c9bee23adfa77aa9dedd22401bba7d\u003cSEP\u003echunk-773d0df1dd25c356f7b771d780583e09\u003cSEP\u003echunk-b0f459f5af1c3a5e0b92cbe4ee48b77b\u003cSEP\u003echunk-83ac129dc9b56f84c46760d153d68e93\u003cSEP\u003echunk-da2472b4ef2a535b62908f14d0fb0ca9\u003cSEP\u003echunk-91614df5cb74cbe5e109a338a82041e9\u003cSEP\u003echunk-54bdd22db1f84a965b5f4c06c9216d8d\u003cSEP\u003echunk-89777b838d5447c7bd1ec11282c4ee89\u003cSEP\u003echunk-74e2466de2f67fd710ef2f20c0a8d9e0\u003cSEP\u003echunk-60fc063c79fc0d4acc91a57e79de04dc\u003cSEP\u003echunk-c6c248858d1b13ab7ee9ca13c1aeed6b\u003cSEP\u003echunk-94bea83e7153fc2064aa382b494936a1\u003cSEP\u003echunk-d9aac3484185ac66045df92214d245d5\u003cSEP\u003echunk-e7637ff18c5ded77a68cce0a87883fad\u003cSEP\u003echunk-99b0ec7f7e006561352b5d65e849611d\u003cSEP\u003echunk-cb661c37436355ccec2769b1d0350c5f\u003cSEP\u003echunk-843b5b2f944c7413d9ca876e2e2f151f\u003cSEP\u003echunk-b2f98bc7abb0c67d4c86055c7fd72218\u003cSEP\u003echunk-8f738cb25d60a7dab782162d9d0a25ed\u003cSEP\u003echunk-9c43dac2fcd5b578242d907ea6f8fc7b\u003cSEP\u003echunk-1aa50206d02ed89418f65f97c6441d1c\u003cSEP\u003echunk-02baee20cc9463dbe08170a8e1043e32\u003cSEP\u003echunk-503f0bfa5453467c7c61d160a3540eca\u003cSEP\u003echunk-e1f29eeadc1d8ab46dc8a0bbd3c56b64\u003cSEP\u003echunk-8590d9263cd2cd4fa583c432fc54e6c3\u003cSEP\u003echunk-c7b10789a9cb0af6c553730b29bd9034\u003cSEP\u003echunk-91572b3cd42786ba4cb2f180ca25cbf4\u003cSEP\u003echunk-90d5764e301321c087f5a8f78b73a145\u003cSEP\u003echunk-bb21d58d36c6306fd8810ddd51c4a971\u003cSEP\u003echunk-f1a4fbcf1ed86864b9bfd5e8dba4c683\u003cSEP\u003echunk-5dac41b3f9eeaf794f0147400b1718cd\u003cSEP\u003echunk-359187e7571bda4b0b08b2e0b6581e52"}, {"color": "#97c2fc", "description": "\"The Spirit\u0027s Torch symbolizes the act of blessing and spreading good ated with family and home, which is lacking in Scrooge\u0027s life.\"", "entity_type": "\"CONCEPT\"", "id": "\"COMFORT\"", "label": "\"COMFORT\"", "shape": "dot", "size": 10, "source_id": "chunk-54bdd22db1f84a965b5f4c06c9216d8d"}, {"color": "#97c2fc", "description": "\"Martha Cratchit is a daughter of the Cratchit family who works as an apprentice and shares her work experiences with the family during the festive gathering.\"\u003cSEP\u003e\"Martha Cratchit is another daughter of Bob Cratchit, adding to the family dynamic and representing the challenges faced by women during the era.\"", "entity_type": "\"PERSON\"", "id": "\"MARTHA CRATCHIT\"", "label": "\"MARTHA CRATCHIT\"", "shape": "dot", "size": 10, "source_id": "chunk-9e3921da66da5d761ab73cd849af6c43\u003cSEP\u003echunk-19d72c57ae3408758b18d2568e86dc6b"}, {"color": "#97c2fc", "description": "\"Fred is Scrooge\u0027s cheerful and optimistic nephew, who embodies the festive spirit that Scrooge initially disdains.\"\u003cSEP\u003e\"Fred is Scrooge\u0027s nephew who expresses admiration for his uncle and offers a toast to him during the Christmas gathering.\"\u003cSEP\u003e\"Fred is Scrooge\u0027s nephew, who expresses surprise and joy at seeing Scrooge at the family dinner, indicating a warm familial relationship.\"\u003cSEP\u003e\"Fred is Scrooge\u0027s nephew, who invites Scrooge to join the Christmas dinner, representing familial warmth and holiday spirit.\"", "entity_type": "\"PERSON\"", "id": "\"FRED\"", "label": "\"FRED\"", "shape": "dot", "size": 10, "source_id": "chunk-89777b838d5447c7bd1ec11282c4ee89\u003cSEP\u003echunk-9e3921da66da5d761ab73cd849af6c43\u003cSEP\u003echunk-e7637ff18c5ded77a68cce0a87883fad\u003cSEP\u003echunk-94bea83e7153fc2064aa382b494936a1"}, {"color": "#97c2fc", "description": "\"Ebenezer Scrooge is a central character, depicted as reflecting on his past, particularly his relationship with Dick Wilkins and his former self.\"\u003cSEP\u003e\"Ebenezer Scrooge is the central character who g
